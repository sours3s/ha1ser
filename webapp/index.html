<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostBot | Logs</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --tg-theme-bg-color: #17212b; --tg-theme-text-color: #ffffff; --tg-theme-button-color: #2481cc; --card-bg: #242f3d; }
        body { background-color: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); font-family: sans-serif; margin: 0; padding: 15px; }
        .tab { display: none; }
        .active { display: block; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 15px; margin-bottom: 12px; }
        .sender { color: #6fb9ef; font-weight: bold; font-size: 0.9em; }
        .chat { color: #8e8e93; font-size: 0.8em; margin-bottom: 5px; }
        .text { font-size: 1em; }
        .nav { position: fixed; bottom: 0; left: 0; width: 100%; display: flex; background: #0f161e; padding: 10px; box-sizing: border-box; }
        .nav button { flex: 1; padding: 10px; background: none; border: none; color: #fff; cursor: pointer; }
    </style>
</head>
<body>
    <div id="tab-logs" class="tab active">
        <h2 style="text-align: center;">🗑 Лог удалений</h2>
        <div id="logs-container"></div>
    </div>
    <div id="tab-settings" class="tab">
        <h2 style="text-align: center;">⚙️ Настройки</h2>
        <div class="card">Управление ботом через кнопки в чате. Сюда можно добавить еще настроек.</div>
    </div>
    <div class="nav">
        <button onclick="switchTab('logs')">🗑 Логи</button>
        <button onclick="switchTab('settings')">⚙️ Настройки</button>
    </div>
    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
        }
        // Здесь мы будем подгружать данные из log_data.json
        fetch('log_data.json').then(r => r.json()).then(data => {
            const container = document.getElementById('logs-container');
            data.forEach(log => {
                container.innerHTML += `<div class="card">
                    <div class="chat">В чате: ${log.chat}</div>
                    <div class="sender">${log.sender}</div>
                    <div class="text">${log.text}</div>
                </div>`;
            });
        });
    </script>
</body>
</html>
