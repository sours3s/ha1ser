<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostBot | App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #17212b; --card: #242f3d; --text: #ffffff; --accent: #6fb9ef; --tab-bg: #0f161e; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding-bottom: 70px; }
        header { background: var(--tab-bg); padding: 15px; text-align: center; font-weight: bold; position: sticky; top: 0; }
        .tab-content { padding: 15px; display: none; }
        .tab-content.active { display: block; }
        .card { background: var(--card); padding: 16px; border-radius: 12px; margin-bottom: 12px; }
        .chat-info { color: #8e8e93; font-size: 0.75em; margin-bottom: 4px; }
        .sender { color: var(--accent); font-weight: 600; }
        .text { font-size: 1em; margin: 6px 0; }
        .btn-chat { display: block; background: var(--accent); color: white; text-align: center; padding: 10px; border-radius: 8px; text-decoration: none; font-size: 0.9em; font-weight: 600; }
        .nav { position: fixed; bottom: 0; width: 100%; display: flex; background: var(--tab-bg); border-top: 1px solid #333; }
        .nav button { flex: 1; border: none; background: none; color: #8e8e93; padding: 15px; }
        .nav button.active { color: var(--accent); }
    </style>
</head>
<body>
    <header>🗑 GhostBot Logs</header>

    <div id="logs-tab" class="tab-content active">
        <div id="logs-list">Загрузка...</div>
    </div>
    <div id="settings-tab" class="tab-content">
        <h2>⚙️ Настройки</h2>
        <div class="card">Управление ботом через команды /menu.</div>
    </div>

    <nav class="nav">
        <button id="btn-logs" class="active" onclick="showTab('logs')">🗑 Логи</button>
        <button id="btn-settings" onclick="showTab('settings')">⚙️ Настройки</button>
    </nav>

    <script>
        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('.nav button').forEach(e => e.classList.remove('active'));
            document.getElementById(tab + '-tab').classList.add('active');
            document.getElementById('btn-' + tab).classList.add('active');
        }

        fetch('data.json?t='+Date.now()).then(r => r.json()).then(data => {
            const list = document.getElementById('logs-list');
            list.innerHTML = data.logs.map(log => `
                <div class="card">
                    <div class="chat-info">Чат: ${log.chat_title}</div>
                    <div class="sender">${log.sender}</div>
                    <div class="text">${log.text}</div>
                    <a class="btn-chat" href="https://t.me/c/${log.chat_id.toString().replace('-100', '')}/${log.msg_id}">Перейти к сообщению</a>
                </div>
            `).join('');
        }).catch(() => document.getElementById('logs-list').innerHTML = "Данных пока нет.");
    </script>
</body>
</html>
