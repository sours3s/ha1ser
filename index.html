<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostBot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #17212b; --card: #242f3d; --text: #ffffff; --accent: #6fb9ef; }
        body { background-color: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 15px; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 10px; }
        .log-chat { color: var(--accent); font-size: 0.8em; }
        .btn { background: var(--accent); color: white; border: none; padding: 8px 12px; border-radius: 8px; margin-top: 5px; }
    </style>
</head>
<body>
    <h2>🗑 Логи удалений</h2>
    <div id="logs">Загрузка...</div>
    <script>
        fetch('data.json').then(r => r.json()).then(data => {
            document.getElementById('logs').innerHTML = data.logs.map(log => \`
                <div class="card">
                    <div class="log-chat">\${log.chat_title}</div>
                    <strong>\${log.sender}</strong>: \${log.text}
                    <br><button class="btn" onclick="openChat(\${log.chat_id})">Перейти к чату</button>
                </div>
            \`).join('');
        });
        function openChat(cid) { window.Telegram.WebApp.openTelegramLink('https://t.me/c/' + cid); }
    </script>
</body>
</html>
