<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostBot | Logs</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --tg-theme-bg-color: #17212b; --tg-theme-text-color: #ffffff; --card-bg: #242f3d; --accent: #6fb9ef; }
        body { background-color: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); font-family: -apple-system, sans-serif; margin: 0; padding: 0; }
        header { padding: 20px; text-align: center; font-size: 1.4em; font-weight: bold; background: #0f161e; }
        .tab-content { padding: 15px; display: none; }
        .tab-content.active { display: block; }
        .card { background: var(--card-bg); padding: 16px; border-radius: 16px; margin-bottom: 12px; }
        .log-meta { font-size: 0.75em; color: #8e8e93; margin-bottom: 6px; display: flex; justify-content: space-between; }
        .sender { color: var(--accent); font-weight: 600; }
        .text { font-size: 1em; line-height: 1.4; color: #e0e0e0; margin-top: 5px; }
        .btn-chat { margin-top: 10px; display: block; background: var(--accent); color: white; text-align: center; padding: 10px; border-radius: 10px; text-decoration: none; font-weight: 600; }
        .nav { position: fixed; bottom: 0; width: 100%; display: flex; background: #0f161e; border-top: 1px solid #333; padding: 5px 0; }
        .nav button { flex: 1; border: none; background: none; color: #fff; padding: 12px; font-size: 0.9em; cursor: pointer; }
        .nav button.active { color: var(--accent); }
    </style>
</head>
<body>
    <header>🗑 GhostBot Logs</header>

    <div id="tab-logs" class="tab-content active">
        <div id="logs-container">⏳ Загрузка...</div>
    </div>

    <div id="tab-settings" class="tab-content">
        <div class="card">
            <h3>⚙️ Настройки отслеживания</h3>
            <p>Управление группами и личками доступно через команду /menu в Telegram.</p>
        </div>
    </div>

    <nav class="nav">
        <button id="btn-logs" class="active" onclick="showTab('logs')">🗑 Логи</button>
        <button id="btn-settings" onclick="showTab('settings')">⚙️ Настройки</button>
    </nav>

    <script>
        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            document.getElementById('btn-' + tab).classList.add('active');
        }

        async function loadLogs() {
            try {
                const response = await fetch('data.json?t=' + Date.now());
                if (!response.ok) throw new Error();
                const data = await response.json();
                const cont = document.getElementById('logs-container');
                if (data.length === 0) throw new Error();
                cont.innerHTML = data.map(log => `
                    <div class="card">
                        <div class="log-meta">
                            <span>CHAT: ${log.chat_title}</span>
                        </div>
                        <div class="sender">${log.sender}</div>
                        <div class="text">${log.text}</div>
                        <a class="btn-chat" href="https://t.me/c/${log.chat_id.toString().replace('-100', '')}/${log.msg_id}">Перейти к чату</a>
                    </div>
                `).join('');
            } catch(e) {
                document.getElementById('logs-container').innerHTML = '<div class="card">Удаленных сообщений пока нет.</div>';
            }
        }
        loadLogs();
    </script>
</body>
</html>
